<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | BEARD BANNA</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav>

        <a href="index.html">Home</a>

        <a href="collection.html">Collection</a>

        <a href="cart.html">Cart</a>

    </nav>

    <section class="section">

        <div class="checkout-container">

            <!-- Delivery Details -->
            <div class="checkout-form">

                <h2>Delivery Details</h2>

                <form id="checkout-form">

                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="name" placeholder="Full Name" required>

                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="Email Address" required>

                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="Phone Number" required>

                    <label>Full Address <span class="required">*</span></label>
                    <textarea id="address" placeholder="Full Address" required></textarea>

                    <label>City <span class="required">*</span></label>
                    <input type="text" id="city" placeholder="City" required>

                    <label>State <span class="required">*</span></label>
                    <input type="text" id="state" placeholder="State" required>

                    <label>PIN Code <span class="required">*</span></label>
                    <input type="text" id="pincode" placeholder="PIN Code" required>

                    <!-- Payment -->
                    <div class="payment-section">

                        <h2>Payment Method <span class="required">*</span></h2>

                        <div class="payment-options">

                            <label class="payment-card">

                                <input type="radio" name="payment" value="cod" required>

                                <div class="payment-content">

                                    <span class="payment-icon">📦</span>

                                    <div>

                                        <h3>Cash On Delivery</h3>

                                        <p>Pay after receiving your order</p>

                                    </div>

                                </div>

                            </label>

                            <label class="payment-card">

                                <input type="radio" name="payment" value="upi">

                                <div class="payment-content">

                                    <span class="payment-icon">📱</span>

                                    <div>

                                        <h3>UPI Payment</h3>

                                        <p>Google Pay • PhonePe • Paytm</p>

                                    </div>

                                </div>

                            </label>

                            <label class="payment-card">

                                <input type="radio" name="payment" value="credit">

                                <div class="payment-content">

                                    <span class="payment-icon">💳</span>

                                    <div>

                                        <h3>Credit Card</h3>

                                        <p>Visa • Mastercard • RuPay</p>

                                    </div>

                                </div>

                            </label>

                            <label class="payment-card">

                                <input type="radio" name="payment" value="debit">

                                <div class="payment-content">

                                    <span class="payment-icon">💳</span>

                                    <div>

                                        <h3>Debit Card</h3>

                                        <p>Visa • Mastercard • RuPay</p>

                                    </div>

                                </div>

                            </label>

                        </div>

                    </div>

                    <div id="payment-details">

                        <!-- UPI -->
                        <div id="upi-section" class="payment-extra">

                            <h3>Pay Using UPI</h3>

                            <div class="upi-box">

                                <img src="images/payment/qr.png" class="qr-image">

                                <h4>Scan QR Code</h4>

                                <p>

                                    UPI ID

                                    <br>

                                    <b>beardbanna@upi</b>

                                </p>

                                <p class="or-text">

                                    OR

                                </p>

                                <label>

                                    Enter UPI ID
                                    <span class="required">*</span>

                                </label>

                                <input type="text" id="upi-id" placeholder="example@upi">

                                <div class="upi-apps">

                                    <img src="images/payment/gpay.png">

                                    <img src="images/payment/phonepe.png">

                                    <img src="images/payment/paytm.png">

                                    <img src="images/payment/bhim.png">

                                </div>

                            </div>

                        </div>

                        <!-- Card -->
                        <div id="card-section" class="payment-extra">

                            <h3>Card Details</h3>

                            <label>Card Number <span class="required">*</span></label>

                            <input type="text" id="card-number" maxlength="19" placeholder="1234 5678 9012 3456">

                            <label>Card Holder Name <span class="required">*</span></label>

                            <input type="text" id="card-name" placeholder="Card Holder Name">

                            <div class="card-row">

                                <div>

                                    <label>Expiry <span class="required">*</span></label>

                                    <input type="text" id="expiry" placeholder="MM/YY">

                                </div>

                                <div>

                                    <label>CVV <span class="required">*</span></label>

                                    <input type="password" id="cvv" maxlength="3" placeholder="123">

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- Order Summary -->
                    <div class="order-summary">

                        <h2>Order Summary</h2>

                        <div id="summary-items"></div>

                        <hr>

                        <p>Subtotal :
                            <span id="subtotal"></span>
                        </p>

                        <p>Shipping :
                            <span id="shipping"></span>
                        </p>

                        <h3>
                            Grand Total :
                            <span id="grandTotal"></span>
                        </h3>

                    </div>

                    <button class="checkout-btn">
                        Place Order
                    </button>

                </form>

            </div>

        </div>

    </section>

    <footer>

        <p>© 2026 BEARD BANNA</p>

    </footer>

    <script src="js/checkout.js"></script>
    <script src="js/payment.js"></script>

    <!-- ==========================
ORDER CONFIRMATION MODAL
========================== -->

    <div id="confirm-modal" class="modal">

        <div class="modal-content">

            <h2>Confirm Your Order</h2>

            <div id="confirm-products"></div>

            <hr>

            <div id="confirm-details"></div>

            <div class="modal-buttons">

                <button class="cancel-btn" onclick="closeModal()">

                    Cancel

                </button>

                <button class="confirm-btn" onclick="confirmOrder()">

                    Confirm Order

                </button>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
