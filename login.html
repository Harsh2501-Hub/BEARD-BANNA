<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEARD BANNA Admin Panel</title>

    <link rel="stylesheet" href="../css2/admin.css">

</head>

<body class="admin-login-page">

    <div class="admin-container">

        <!-- Left Side -->

        <div class="admin-left">

            <h1>

                👑 BEARD BANNA

            </h1>

            <h2>

                ADMIN PANEL

            </h2>

            <p class="admin-tagline">

                HONOR • HISTORY • HERITAGE

            </p>

            <div class="admin-info">

                <p>

                    🔒 Authorized Personnel Only

                </p>

                <p>

                    🛡 Secure Administration Portal

                </p>

                <p>

                    📦 Manage Products, Orders & Customers

                </p>

            </div>

        </div>

        <!-- Right Side -->

        <div class="admin-right">

            <div class="login-card">

                <h2>

                    Welcome Back

                </h2>

                <p>

                    Sign in to continue

                </p>

                <form id="admin-login-form" autocomplete="off">

                    <input type="text" id="admin-username" autofocus placeholder="Admin Username" required>

                    <input type="password" id="admin-password" placeholder="Password" required>

                    <button type="submit">

                        Login

                    </button>

                </form>

                <div class="admin-footer">

                    <p>

                        Version 1.0

                    </p>

                    <p>

                        © 2026 BEARD BANNA

                    </p>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/ui.js"></script>
    <script src="../admin-js/admin-auth.js"></script>

</body>

</html>
