<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEARD BANNA Admin Panel</title>
    <link rel="stylesheet" href="/admin-panel/css/admin.css">
</head>

<body class="admin-login-page">
    <div class="admin-container">
        <!-- Left Side -->
        <div class="admin-left">
            <h1>👑 BEARD BANNA</h1>
            <h2>ADMIN PANEL</h2>
            <p class="admin-tagline">HONOR • HISTORY • HERITAGE</p>
            <div class="admin-info">
                <p>🔒 Authorized Personnel Only</p>
                <p>🛡 Secure Administration Portal</p>
                <p>📦 Manage Products, Orders & Customers</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="admin-right">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p>Sign in to continue</p>

                <form id="admin-login-form" autocomplete="off">
                    <input type="text" id="admin-username" placeholder="Admin Username" autocorrect="off" autocapitalize="none" spellcheck="false" required>
                    <input type="password" id="admin-password" placeholder="Password" autocorrect="off" autocapitalize="none" spellcheck="false" required>
                    <button type="submit">Login</button>
                </form>

                <div class="admin-footer">
                    <p>Version 1.0</p>
                    <p>© 2026 BEARD BANNA</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin-panel/js/api.js"></script>
    <script src="/admin-panel/js/ui.js"></script>
    <!-- Supabase: required for admin-auth.js to sign admin into Supabase for RLS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/admin-panel/js/supabase-config.js"></script>
    <script src="/admin-panel/js/supabase-client.js"></script>
    <script src="/admin-panel/js/admin-auth.js"></script>
</body>

</html>
