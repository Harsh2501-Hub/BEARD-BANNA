<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BEARD BANNA</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav>

        <a href="index.html">Home</a>

        <a href="collection.html">Collection</a>

        <a href="cart.html" id="cart-link">

            🛒 Cart

            <span id="cart-count">0</span>

        </a>

    </nav>

    <section class="login-section">

        <div class="login-card">

            <h1>

                Create Account

            </h1>

            <p>

                Join the

                <b>BEARD BANNA</b>

                family today.

            </p>

            <form id="register-form">

                <input type="text" id="register-name" placeholder="Full Name" required>

                <input type="email" id="register-email" placeholder="Email Address" required>

                <input type="tel" id="register-phone" placeholder="Phone Number" required>

                <input type="password" id="register-password" placeholder="Password" required>

                <input type="password" id="confirm-password" placeholder="Confirm Password" required>

                <button type="submit" class="checkout-btn">

                    Create Account

                </button>

            </form>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </section>

    <script src="js/cart.js"></script>

    <script src="js/register.js"></script>

</body>

</html>
