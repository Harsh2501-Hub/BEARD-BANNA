<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders | BEARD BANNA</title>

    <link rel="stylesheet" href="../css2/admin.css">

</head>

<body class="admin-dashboard">

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <h2>👑 BEARD BANNA</h2>

                <span>Admin Panel</span>

            </div>

            <nav>

                <a href="dashboard.html">

                    📊 Dashboard

                </a>

                <a href="products.html">

                    📦 Products

                </a>

                <a href="categories.html">

                    📂 Categories

                </a>

                <a href="orders.html" class="active">

                    🛒 Orders

                </a>

                <a href="customers.html">

                    👥 Customers

                </a>

                <a href="analytics.html">

                    📈 Analytics

                </a>

                <a href="settings.html">

                    ⚙ Settings

                </a>

            </nav>

            <button id="logout-btn">

                🚪 Logout

            </button>

        </aside>

        <!-- Main -->

        <main class="dashboard-content">

            <div class="orders-header">

                <section class="order-stats">

                    <div class="stat-card">

                        <h3>Total Orders</h3>

                        <h2 id="stat-total-orders">0</h2>

                    </div>

                    <div class="stat-card">

                        <h3>Pending</h3>

                        <h2 id="stat-pending-orders">0</h2>

                    </div>

                    <div class="stat-card">

                        <h3>Shipped</h3>

                        <h2 id="stat-shipped-orders">0</h2>

                    </div>

                    <div class="stat-card">

                        <h3>Revenue</h3>

                        <h2 id="stat-total-revenue">₹0</h2>

                    </div>

                </section>

                <h1>

                    🛒 Order Management

                </h1>

                <p>

                    Manage customer orders, update status and monitor sales.

                </p>

            </div>

            <!-- Toolbar -->

            <div class="orders-toolbar">

                <input type="text" id="order-search" placeholder="🔍 Search Order ID or Customer">

                <select id="status-filter">

                    <option value="all">
                        📋 All Orders
                    </option>

                    <option value="Pending">
                        🟡 Pending
                    </option>

                    <option value="Confirmed">
                        🔵 Confirmed
                    </option>

                    <option value="Packed">
                        🟣 Packed
                    </option>

                    <option value="Shipped">
                        🟢 Shipped
                    </option>

                    <option value="Delivered">
                        ✅ Delivered
                    </option>

                    <option value="Cancelled">
                        🔴 Cancelled
                    </option>

                </select>

            </div>

            <!-- Orders Table -->

            <div class="orders-table-container">

                <table class="orders-table">

                    <thead>

                        <tr>

                            <th>Order ID</th>

                            <th>Customer</th>

                            <th>Total</th>

                            <th>Status</th>

                            <th>Date</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="orders-body">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="../admin-js/admin-auth.js"></script>
    <script src="../admin-js/orders.js"></script>

    <!-- ===============================
     ORDER DETAILS MODAL
================================ -->

    <div id="order-modal" class="modal">

        <div class="modal-content">

            <span id="close-modal" class="close-btn">

                &times;

            </span>

            <div id="order-details">

            </div>

        </div>

    </div>

</body>

</html>
