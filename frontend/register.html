<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | BEARD BANNA — Royal Heritage</title>
    <meta name="description" content="Create your BEARD BANNA account and join the royal heritage apparel community.">

    <!-- Google Fonts for Royal Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <header>
        <img src="images/Logo-removebg-preview.png" alt="Beard Banna Logo" class="logo">
        <p>HONOR • HISTORY • HERITAGE</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="cart.html" id="cart-link">🛒 Cart <span id="cart-count">0</span></a>
        <a href="register.html" class="active">Sign Up</a>
        <span id="user-area"></span>
    </nav>

    <section class="section">
        <div class="login-card" style="margin: 30px auto; max-width: 480px;">
            <h1>Sign Up</h1>
            <p style="color: #cbd5e1; margin-bottom: 20px;">
                Join the <b>BEARD BANNA</b> royal family today.
            </p>

            <!-- Error message container -->
            <div id="register-error" class="auth-error" style="display:none;"></div>

            <!-- Email verification / success message -->
            <div id="register-success" class="auth-success" style="display:none;"></div>

            <form id="register-form">
                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <input type="text" id="register-name" placeholder="Full Name" required
                        style="width: 100%;" autocomplete="name">
                </div>

                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <input type="email" id="register-email" placeholder="Email Address" required
                        style="width: 100%;" autocomplete="email">
                </div>

                <div class="input-wrapper" style="margin-bottom: 16px;">
                    <input type="tel" id="register-phone" placeholder="Phone Number (Optional)"
                        style="width: 100%;" autocomplete="tel">
                </div>

                <div class="input-wrapper password-wrapper" style="position: relative; margin-bottom: 16px;">
                    <input type="password" id="register-password" placeholder="Password (min. 6 characters)"
                        required style="width: 100%;" autocomplete="new-password">
                    <button type="button" class="eye-toggle-btn"
                        onclick="togglePasswordVisibility('register-password', this)"
                        title="Show/Hide Password"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #fbbf24;">
                        👁️
                    </button>
                </div>

                <div class="input-wrapper password-wrapper" style="position: relative; margin-bottom: 20px;">
                    <input type="password" id="confirm-password" placeholder="Confirm Password"
                        required style="width: 100%;" autocomplete="new-password">
                    <button type="button" class="eye-toggle-btn"
                        onclick="togglePasswordVisibility('confirm-password', this)"
                        title="Show/Hide Password"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #fbbf24;">
                        👁️
                    </button>
                </div>

                <button type="submit" class="checkout-btn" id="register-submit-btn" style="width: 100%;">
                    Sign Up
                </button>
            </form>

            <!-- Divider -->
            <div class="or-divider" style="display:flex;align-items:center;gap:12px;margin:20px 0;color:#4a5568;font-size:0.8rem;font-weight:600;letter-spacing:1px;">
                <span style="flex:1;height:1px;background:rgba(212,175,55,0.15);display:block;"></span>
                OR SIGN UP WITH
                <span style="flex:1;height:1px;background:rgba(212,175,55,0.15);display:block;"></span>
            </div>

            <!-- Social Sign Up -->
            <div style="display:flex;flex-direction:column;gap:12px;">
                <button class="oauth-btn google-btn" id="register-google-btn" type="button"
                    style="display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;border-radius:12px;border:1.5px solid rgba(66,133,244,0.4);background:rgba(66,133,244,0.06);color:#e2d7c5;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;transition:all 0.22s ease;width:100%;">
                    <span style="width:22px;height:22px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;color:#4285f4;font-family:Arial,sans-serif;flex-shrink:0;">G</span>
                    Sign up with Google
                </button>
                <button class="oauth-btn github-btn" id="register-github-btn" type="button"
                    style="display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.04);color:#e2d7c5;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;transition:all 0.22s ease;width:100%;">
                    <span>🐱</span>
                    Sign up with GitHub
                </button>
            </div>

            <p class="login-link" style="margin-top: 24px; text-align: center; color: #94a3b8;">
                Already have an account?
                <a href="login.html" style="color: #fbbf24; font-weight: 700; text-decoration: none;">
                    Sign In
                </a>
            </p>
        </div>
    </section>

    <footer>
        <p style="margin: 0; padding: 10px 0;"><a href="creator.html" style="color: #ffd700; text-decoration: none; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); transition: all 0.3s ease;">Developed &amp; Maintained by Himanshu ↗</a></p>
    </footer>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
    <script>
      // Social sign-up buttons
      document.getElementById('register-google-btn')?.addEventListener('click', async () => {
        const btn = document.getElementById('register-google-btn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span>⏳</span> Connecting to Google...'; }
        try {
          const { error } = await window.supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/frontend/index.html' }
          });
          if (error) throw error;
        } catch (err) {
          if (btn) { btn.disabled = false; btn.innerHTML = '<span style="width:22px;height:22px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;color:#4285f4;">G</span> Sign up with Google'; }
          const errDiv = document.getElementById('register-error');
          if (errDiv) { errDiv.innerHTML = 'Google sign-in is not configured yet. Please use email/password.'; errDiv.style.display = 'block'; }
        }
      });
      document.getElementById('register-github-btn')?.addEventListener('click', async () => {
        const btn = document.getElementById('register-github-btn');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span>⏳</span> Connecting to GitHub...'; }
        try {
          const { error } = await window.supabaseClient.auth.signInWithOAuth({
            provider: 'github',
            options: { redirectTo: window.location.origin + '/frontend/index.html' }
          });
          if (error) throw error;
        } catch (err) {
          if (btn) { btn.disabled = false; btn.innerHTML = '<span>🐱</span> Sign up with GitHub'; }
          const errDiv = document.getElementById('register-error');
          if (errDiv) { errDiv.innerHTML = 'GitHub sign-in is not configured yet. Please use email/password.'; errDiv.style.display = 'block'; }
        }
      });
    </script>

</body>

</html>
