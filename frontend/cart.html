<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | BEARD BANNA</title>

    <!-- Google Fonts for Classic & Royal Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <header>
        <img src="images/Logo-removebg-preview.png" alt="Beard Banna Logo" class="logo">
        <p>HONOR • HISTORY • HERITAGE</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="wishlist.html" id="wishlist-link">❤️ Wishlist <span id="wishlist-count">0</span></a>
        <a href="cart.html" id="cart-link" class="active">🛒 Cart <span id="cart-count">0</span></a>
        <span id="user-area"></span>
    </nav>

    <section class="section">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>

        <div class="checkout-section">
            <h2 id="grand-total"></h2>
            <button class="checkout-btn" onclick="goToCheckout()">
                Proceed to Checkout
            </button>
        </div>
    </section>

    <footer>
        <p style="margin: 0; padding: 10px 0;"><a href="creator.html" style="color: #ffd700; text-decoration: none; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); transition: all 0.3s ease;">Developed & Maintained by Himanshu ↗</a></p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/main.js"></script>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/supabase-auth.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
